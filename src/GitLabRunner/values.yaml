gitlabUrl: https://git.21-school.ru

rbac:
  create: true
serviceAccount:
  create: true

envVars:
  - name: DOCKER_HUB_USER
    value: "swarthma"
  - name: DOCKER_HUB_TOKEN
    value:  "<your-docker-token-here>"

runners:
  config: |
    concurrent = 10
    check_interval = 3
    [[runners]]
      name = "kubernetes-runner"
      request_concurrency = 4
      executor = "kubernetes"
      [runners.kubernetes]
        image = "docker:stable"
        namespace = "gitlab-runner"
        privileged = true
        [runners.kubernetes.pod_security_context]
          run_as_non_root = false
        [runners.kubernetes.resources]
          requests = { cpu = "500m", memory = "1Gi" }
          limits   = { cpu = "1000m", memory = "2Gi" }

secrets:
  - name: gitlab-runner-token